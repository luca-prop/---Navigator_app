# Free-plan Supabase pauses after ~7 days without DB traffic.
# Paid (Pro) orgs never pause. This ping is the free-plan workaround.
#
# Required GitHub Actions secret:
#   SUPABASE_DB_URL = Transaction/Session Postgres URI (same as DATABASE_URL)
name: supabase-keepalive
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psycopg2
        run: python -m pip install --upgrade pip psycopg2-binary
      - name: Ping Postgres (SELECT 1)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set GitHub secret SUPABASE_DB_URL (Prisma DATABASE_URL)"
            exit 1
          fi
          python <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=20)
          cur = conn.cursor()
          cur.execute("select 1")
          cur.fetchone()
          try:
              cur.execute("select count(*) from zones")
              n = cur.fetchone()[0]
              print(f"keepalive ok zones={n}")
          except Exception:
              conn.rollback()
              print("keepalive ok (select 1)")
          cur.close()
          conn.close()
          PY
